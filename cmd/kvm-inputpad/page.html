<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>kvm inputpad 128x128</title>
<!--
  THE PAGE IS NOW THREE FILES, ON PURPOSE.

    1. page.html          — chrome, CSS, and the DOM/canvas plumbing (this file)
    2. pad-core.js        — THE STROKE STATE MACHINE. down -> drag* -> up over
                            data, no DOM, no timers it does not own.
    3. pad-events.js      — the DOM event layer. Translates browser events into
                            machine calls. Owns no latch and no ink.

  Why: the capture logic used to be four listeners sharing three module globals
  (`down`, `last`, `pts`) plus a 40 ms settle timer that lived next to the
  listeners. The user's report — "mouse down, move and up are not correctly
  captured" and "the most up events in particular is not captured correctly
  causing the ink to linger" — is a property of that arrangement, not of any one
  line. Splitting the state machine out is what makes the transitions inspectable
  and testable outside a browser (`node --test`).

  Load order matters and is enforced by the shims below.

  NOTE: no backticks anywhere in this file's script — it is served as a single
  asset and a backtick inside a template literal here has broken the build
  before. The rule still applies to any string we emit.
-->
<style>
 body{margin:0;font:13px system-ui;background:#111;color:#eee;
      min-height:100vh;display:flex;flex-direction:column}
 .bar{display:flex;align-items:center;height:40px;box-sizing:border-box;
      padding:0 10px;overflow:hidden;column-gap:10px}
 .bar.top{justify-content:space-between}
 .bar.bot{justify-content:flex-start;gap:14px;font:12px/20px ui-monospace,monospace}
 .bar.bot #live{margin-left:auto}
 .title{font:600 14px/20px system-ui;letter-spacing:.3px;flex:none;overflow:visible}
 .actions{display:flex;gap:8px;flex:none}
 .bar button{height:26px;box-sizing:border-box}
 .bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #hud{flex:none;width:15ch}
 #count{flex:none;width:16ch}
 #live{flex:none;width:30ch;min-width:30ch;text-align:right;color:#9aa}
 #pad{display:block;margin:0 auto;background:#fff;cursor:crosshair;
      box-shadow:0 0 0 1px #555;
      touch-action:none;-webkit-user-select:none;user-select:none;
      width:768px;height:768px;
      max-width:min(calc(100vw - 20px), calc(100vh - 80px));
      max-height:min(calc(100vw - 20px), calc(100vh - 80px));
      aspect-ratio:1/1}
 .bar.bot{margin-top:auto}
</style>
<div class="bar top">
  <span class="title">Inputpad</span>
  <span class="actions">
    <button id=clear>Clear</button>
    <button id=save>Export</button>
  </span>
</div>
<canvas id=pad width=768 height=768></canvas>
<div class="bar bot">
  <span id=hud>cell —,—</span>
  <span id=count>0 strokes</span>
  <span id=live></span>
</div>
<!--PAD_MODULES-->
<script>
// ===========================================================================
// page.js — the canvas, the readouts, the log transport. NO STROKE STATE.
// ===========================================================================
const N=128, cv=document.getElementById('pad'), g=cv.getContext('2d');
const hud=document.getElementById('hud'), count=document.getElementById('count');
const live=document.getElementById('live');

// JSV is THIS PAGE'S GENERATION. A tab keeps running the JS it loaded, so a
// restarted server can be answering a page executing older code. BUMP THIS
// whenever pos(), the recorded shape, or the module split changes — it is the
// only signal that distinguishes "the page running now" from "the page that was
// loaded before the rework".
const JSV = 5;

// POINTER SPACE. The grid must be SQUARE ON SCREEN: the buffer is resized to the
// smaller side of the CSS box, so pos() and px() are exact inverses at any
// display scale and a diagonal drag is never slanted.
function fitSquare(){
  const r = cv.getBoundingClientRect();
  const side = Math.max(64, Math.round(Math.min(r.width, r.height)));
  if(cv.width !== side){ cv.width = side; cv.height = side; }
  return side;
}
// CORNER MARKERS (TODO-COORDINATES.md 9.2). QR-style fiducials THREE of the
// four corners of the canvas, so that a SCREENSHOT can be decoded by a script
// (scripts/pad_bbox.py) and the canvas rect recovered exactly -- replacing the
// back-solved anchor, which was circular. The user's constraints, as recorded:
//   * GREY cells, not black: a pen stroke drawn over a marker must COVER it
//     (black wins), so the marker can never be mistaken for ink.
//   * THREE markers, not four. This is what a QR symbol actually looks like:
//     TL, TR and BL carry a finder pattern and the fourth corner is left bare.
//     Four was an invention of ours -- the user's correction: "角上的二维码，你在4个
//     角都画了，这是不对的". A fourth mark carries no information the other three
//     do not already give (three corners fix both axes and the scale), so it
//     was pure decoration and is now gone.
// THE MARKER IS A REAL QR FINDER PATTERN, NOT AN INVENTION OF OURS.
// The user's correction: "I was assuming the corner code is showing like a QR
// corner but it seems you invent yourself". The earlier 9x9 blob with a 3x3 eye
// and a nib was invented and no QR reader could decode it. This is the genuine
// article (ISO/IEC 18004 finder pattern): 7x7 cells of concentric rings at
// 1:1:3:1:1 -- a solid 3x3 centre, a one-cell light ring, a one-cell dark ring
// -- surrounded by the mandatory one-cell LIGHT separator, so the whole mark is
// 9x9 cells. Drawn at 6 px per cell on a 128 grid a mark is 6 cells wide
// (36/768 of the side), and on this rig's 553 px canvas that is ~39 px: the
// same size the earlier blob had, so the layout is unchanged and only the
// picture becomes a QR corner.
//
// The separator must be WHITE, not bare canvas: the grid lines are drawn before
// the marker, so without repainting the separator we would leave grid through
// it and the quiet zone would not be quiet.
const MK_RING = 7;                 // the finder pattern itself
const MK_CELLS = MK_RING + 2;      // + one separator cell on each side
const MK_SEP = 1;                  // cells of light quiet zone around it
// finder[y][x] over the 7x7 rings, 1 = dark. 1:1:3:1:1.
function mkFinder(y, x){
  const d = Math.max(Math.abs(x - 3), Math.abs(y - 3));  // ring index 0..3
  return (d === 3 || d <= 1) ? 1 : 0;                    // border + centre dark
}
// THREE corners, as a QR symbol has: TL, TR, BL. BR is deliberately bare.
const MK_CORNERS = [[0,0],[N-MK_CELLS,0],[0,N-MK_CELLS]];
function marker(S){
  const cell = S/N;
  const dark='#9a9a9a', light='#ffffff';
  for(const c of MK_CORNERS){
    // SEPARATOR FIRST: repaint the quiet-zone cell white so the grid lines
    // drawn a moment earlier cannot show through the finder pattern's margin.
    g.fillStyle=light;
    g.fillRect(Math.round(c[0]*cell), Math.round(c[1]*cell),
               Math.ceil(MK_CELLS*cell), Math.ceil(MK_CELLS*cell));
    g.fillStyle=dark;
    for(let j=0;j<MK_RING;j++) for(let i=0;i<MK_RING;i++){
      if(!mkFinder(j,i)) continue;
      const cx=c[0]+MK_SEP+i, cy=c[1]+MK_SEP+j;
      // Snap every cell to exact pixel edges: the last cell must meet the
      // border with no hairline gap, and none may spill past the clip.
      const x0=Math.round(cx*cell), y0=Math.round(cy*cell);
      const x1=Math.round((cx+1)*cell), y1=Math.round((cy+1)*cell);
      g.fillRect(x0, y0, Math.max(1,x1-x0), Math.max(1,y1-y0));
    }
  }
  return MK_CELLS*cell;
}
function grid(){
  const S = fitSquare();
  g.fillStyle='#fff'; g.fillRect(0,0,S,S);
  const step = S/N;
  g.fillStyle='#e6e6e6';
  for(let i=0;i<N;i+=8){ g.fillRect(i*step,0,1,S); g.fillRect(0,i*step,S,1);}
  g.fillStyle='#c8c8c8';
  for(let i=0;i<N;i+=32){ g.fillRect(i*step,0,1,S); g.fillRect(0,i*step,S,1);}
  marker(S);
}
// pos() is the ONE place a pointer event becomes a coordinate. It records PURE
// CSS-BOX RATIOS (rx, ry in [0,1]); px() is their exact inverse. Deriving the
// ratio from the CSS box while multiplying by the backing store is what made
// ink drift away from the cursor off-centre.
function pos(e, rect){
  const r = rect || cv.getBoundingClientRect();
  if(!(r.width > 0 && r.height > 0)) return null;
  const rx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const ry = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  const u = rx * N, v = ry * N;
  const x = Math.min(N - 1, Math.floor(u)), y = Math.min(N - 1, Math.floor(v));
  return { x:x, y:y, fx:u-x, fy:v-y, rx:rx, ry:ry };
}
function px(p){
  const fx = p.fx === undefined ? 0.5 : p.fx, fy = p.fy === undefined ? 0.5 : p.fy;
  const rxi = p.rx === undefined ? (p.x + fx) / N : p.rx;
  const ryi = p.ry === undefined ? (p.y + fy) / N : p.ry;
  return { x: rxi * cv.width, y: ryi * cv.height };
}
function line(a,b){
  const A=px(a), B=px(b);
  g.strokeStyle='#111'; g.lineWidth=2; g.lineCap='round';
  g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke();
}
// paintAll is the ONLY erase. It repaints the whole canvas from the machine's
// snapshot, so ink that is not in the snapshot cannot survive a repaint.
function paintAll(snap){
  grid();
  const strokes = snap ? snap.strokes : core.committed;
  for(const st of strokes) for(let i=1;i<st.length;i++) line(st[i-1], st[i]);
  const tailPts = snap ? snap.live : core.tail;
  for(let i=1;i<tailPts.length;i++) line(tailPts[i-1], tailPts[i]);
  count.textContent = (snap ? snap.strokes : core.committed).length + ' strokes';
}

// ---------------------------------------------------------------------------
// LOG TRANSPORT. One event per input; the log is an EVENT LOG, so the observer
// reconstructs strokes from down/drag/up. The page never sends a stroke.
// ---------------------------------------------------------------------------
const TS_KEY = 'kvm-pad-last-ts';
let lastTS = 0;
try { lastTS = parseInt(sessionStorage.getItem(TS_KEY) || '0', 10) || 0; } catch(err) {}
// STRICTLY INCREASING. Date.now() has 1 ms granularity and the host can deliver
// a press and its first move, or two moves, inside one millisecond, so two
// events of one gesture could share a ts and the store de-duplicated one away
// (measured: a 315 px drag reduced to two records).
function nextTS(){
  const n = Date.now();
  lastTS = n > lastTS ? n : lastTS + 1;
  try { sessionStorage.setItem(TS_KEY, String(lastTS)); } catch(err) {}
  return lastTS;
}
const CLIENT_KEY = 'kvm-pad-client';
let CLIENT_ID = null;
function clientId(){
  if(CLIENT_ID) return CLIENT_ID;
  try { CLIENT_ID = sessionStorage.getItem(CLIENT_KEY); } catch(err) {}
  if(!CLIENT_ID){
    CLIENT_ID = crypto.randomUUID ? crypto.randomUUID()
              : 'pad-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
    try { sessionStorage.setItem(CLIENT_KEY, CLIENT_ID); } catch(err) {}
  }
  return CLIENT_ID;
}
const PROTOCOL = 2;   // must equal store.go's Protocol; a mismatch makes this page reload
let queue = [], flushT = 0;
const PUSH_DEBOUNCE_MS = 120;
let inFlight = Promise.resolve();
function send(body){
  const payload = {client: clientId(), version: PROTOCOL, events: body};
  const my = inFlight.then(() => fetch('/api/log', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(payload), keepalive: true})
    .then(r => {
      if(r.status === 409){
        live.textContent = 'protocol mismatch — reloading';
        setTimeout(() => location.reload(), 0);
        return Promise.reject('protocol mismatch');
      }
      return r.ok ? r.json() : Promise.reject('HTTP ' + r.status);
    }));
  inFlight = my.catch(() => {});
  return my;
}
function flush(){
  if(!queue.length) return;
  const batch = queue; queue = [];
  send(batch)
    .then(res => { live.textContent = 'appended ' + res.appended + ' event(s), '
                                  + res.duplicates + ' duplicate(s)'; })
    .catch(err => {
      // A failed batch goes back on the queue so input that happened on screen
      // is retried instead of lost. flush() re-sends the SAME kind and ts, which
      // is why the store's de-dup key includes kind and retries stay idempotent.
      queue = batch.concat(queue);
      live.textContent = 'append failed: ' + err;
    });
}
function push(kind, at){
  const ev = {kind: kind, ts: nextTS()};
  if(at){ ev.rx = at.rx; ev.ry = at.ry; }
  queue.push(ev);
  clearTimeout(flushT);
  flushT = setTimeout(flush, PUSH_DEBOUNCE_MS);
}

// ---------------------------------------------------------------------------
// THE MACHINE. pad-core.js is CommonJS, so it arrives here as a module record.
// ---------------------------------------------------------------------------
const core = createPadCore({
  posOf: function(ev){ return ev && ev.rx !== undefined ? ev : pos(ev); },
  onInk: function(from, to){ if(from) line(from, to); },
  onRepaint: function(snap){ paintAll(snap); },
  onEvent: function(kind, at){ push(kind, at); },
  onTransition: function(from, to, why){
    // The observable record of a capture bug: every latch change names itself.
    lastTransition = to + '(' + why + ')';
  },
});
let lastTransition = '';
const bound = bindPad({
  canvas: cv,
  windowTarget: window,
  core: core,
  posOf: function(ev){ return pos(ev); },
  onSample: function(){ /* the machine already painted; nothing to record here */ },
  show: function(e){
    const r = cv.getBoundingClientRect();
    if(e.clientX < r.left || e.clientX >= r.right || e.clientY < r.top || e.clientY >= r.bottom){
      hud.textContent = 'off-grid'; return;
    }
    const p = pos(e, r);
    if(!p) return;
    hud.textContent = 'cell ' + Math.floor(p.rx*N) + ', ' + Math.floor(p.ry*N);
  },
  onIgnore: function(why, e){ live.textContent = 'ignored: ' + why; },
});

// load is the page-reload boundary. The machine is told explicitly rather than
// the transport pushing a bare 'load' event, so the machine's own state (a live
// tail, an armed press, a pending commit) is retired with the ink. A reload must
// start blank: nothing from the previous generation may be re-added.
core.load();

// ---------------------------------------------------------------------------
// Export writes the PAGE'S OWN INK as a .json download. It used to GET a
// server-side record route, deleted on purpose (PAD-PROTOCOL §5: the API
// receives the log, the observer reads the file).
// ---------------------------------------------------------------------------
document.getElementById('save').onclick = function(){
  live.textContent = 'exporting…';
  const strokes = core.committed;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = 'padtrace-' + stamp + '.json';
  const blob = new Blob([JSON.stringify(strokes, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  URL.revokeObjectURL(url);
  live.textContent = 'exported ' + strokes.length + ' stroke(s)';
};
// Clear empties the page AND records the boundary in the log. The pending queue
// is dropped with it: a stroke lifted just before the Clear must not arrive
// after it, and send() queues the clear BEHIND any commit already dispatched.
//
// paintAll runs from the machine's onRepaint, so the canvas is blanked by the
// SAME path that draws it — there is no second, competing erase. `core.clear()`
// also drops a stroke the pen is still holding, so the lift that arrives after
// this cannot commit pre-clear ink.
document.getElementById('clear').onclick = function(){
  queue = []; clearTimeout(flushT);
  core.clear();
  flush();
  count.textContent = '0 strokes';
  live.textContent = 'cleared (new epoch)';
};

// ---------------------------------------------------------------------------
// publishBox reports the live canvas rect so a drawer can calibrate instead of
// guessing px-per-cell. VIEWPORT coordinates only — pos() subtracts the
// viewport r.left, so publishing document coordinates would be off by scroll.
// ---------------------------------------------------------------------------
function publishBox(){
  const r = cv.getBoundingClientRect();
  if(!(r.width > 0 && r.height > 0)) return;
  fetch('/api/box', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({x: Math.round(r.left), y: Math.round(r.top),
                          w: Math.round(r.width), h: Math.round(r.height),
                          scrollX: Math.round(window.scrollX || 0),
                          scrollY: Math.round(window.scrollY || 0),
                          jsv: JSV, dpr: window.devicePixelRatio || 1})})
    .catch(() => {});
}
// A webview pane can change the canvas's CSS box without any resize event, so a
// press also publishes. Registered ONCE per target; the old page registered the
// visualViewport listener twice.
cv.addEventListener('pointerdown', publishBox, {passive:true});
addEventListener('resize', publishBox);
if(window.visualViewport) visualViewport.addEventListener('resize', publishBox);
addEventListener('scroll', publishBox, {passive:true});
// A tab closing right after a lift would drop that stroke: keepalive lets the
// request outlive the page.
addEventListener('pagehide', function(){
  if(!queue.length) return;
  const batch = queue; queue = [];
  try{ send(batch).catch(() => {}); }catch(e){}
});

publishBox();
grid();
</script>
