<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>kvm inputpad 128x128</title>
<!--
  THE PAGE IS NOW THREE FILES, ON PURPOSE.

    1. page.html          — chrome, CSS, and the DOM/canvas plumbing (this file)
    2. pad-core.js        — THE STROKE STATE MACHINE. down -> drag* -> up over
                            data, no DOM, no timers it does not own.
    3. pad-events.js      — the DOM event layer. Translates browser events into
                            machine calls. Owns no latch and no ink.

  Why: the capture logic used to be four listeners sharing three module globals
  (`down`, `last`, `pts`) plus a 40 ms settle timer that lived next to the
  listeners. The user's report — "mouse down, move and up are not correctly
  captured" and "the most up events in particular is not captured correctly
  causing the ink to linger" — is a property of that arrangement, not of any one
  line. Splitting the state machine out is what makes the transitions inspectable
  and testable outside a browser (`node --test`).

  Load order matters and is enforced by the shims below.

  NOTE: no backticks anywhere in this file's script — it is served as a single
  asset and a backtick inside a template literal here has broken the build
  before. The rule still applies to any string we emit.
-->
<style>
 body{margin:0;font:13px system-ui;background:#111;color:#eee;
      min-height:100vh;display:flex;flex-direction:column}
 .bar{display:flex;align-items:center;height:40px;box-sizing:border-box;
      padding:0 10px;overflow:hidden;column-gap:10px}
 .bar.top{justify-content:space-between}
 .bar.bot{justify-content:flex-start;gap:14px;font:12px/20px ui-monospace,monospace}
 .bar.bot #live{margin-left:auto}
 .title{font:600 14px/20px system-ui;letter-spacing:.3px;flex:none;overflow:visible}
 .actions{display:flex;gap:8px;flex:none}
 .bar button{height:26px;box-sizing:border-box}
 .bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #hud{flex:none;width:15ch}
 #count{flex:none;width:16ch}
 #live{flex:none;width:30ch;min-width:30ch;text-align:right;color:#9aa}
 #pad{display:block;margin:0 auto;background:#fff;cursor:crosshair;
      box-shadow:0 0 0 1px #555;
      touch-action:none;-webkit-user-select:none;user-select:none;
      /* FIT THE VIEWPORT, SQUARE, NO SCROLLING. The user's requirement: the pad
         must fit on screen without scrolling. The page chrome is two 40 px bars,
         so the canvas gets the rest of the viewport height and is capped by the
         width too; whichever is smaller wins. It stays SQUARE because a QR is
         square and a distorted symbol does not decode. */
      width:min(calc(100vw - 16px), calc(100vh - 96px));
      height:min(calc(100vw - 16px), calc(100vh - 96px));
      aspect-ratio:1/1}
 .bar.bot{margin-top:auto}
</style>
<div class="bar top">
  <span class="title">Inputpad</span>
  <span class="actions">
    <button id=clear>Clear</button>
    <button id=save>Export</button>
  </span>
</div>
<canvas id=pad width=768 height=768></canvas>
<!--PAD_QR-->
<div class="bar bot">
  <span id=hud>cell —,—</span>
  <span id=count>0 strokes</span>
  <span id=live></span>
</div>
<!--PAD_MODULES-->
<script>
// ===========================================================================
// page.js — the canvas, the readouts, the log transport. NO STROKE STATE.
// ===========================================================================
const N=128, cv=document.getElementById('pad'), g=cv.getContext('2d');
const hud=document.getElementById('hud'), count=document.getElementById('count');
const live=document.getElementById('live');

// JSV is THIS PAGE'S GENERATION. A tab keeps running the JS it loaded, so a
// restarted server can be answering a page executing older code. BUMP THIS
// whenever pos(), the recorded shape, or the module split changes — it is the
// only signal that distinguishes "the page running now" from "the page that was
// loaded before the rework".
const JSV = 5;

// POINTER SPACE. The grid must be SQUARE ON SCREEN: the buffer is resized to the
// smaller side of the CSS box, so pos() and px() are exact inverses at any
// display scale and a diagonal drag is never slanted.
function fitSquare(){
  // THE BACKING STORE IS FIXED. It used to be sized from
  // getBoundingClientRect(), and because assigning canvas.width/height CLEARS
  // the bitmap, every later layout pass silently wiped the symbol -- measured:
  // the trace read `S=812 ctx=ok dark 0`, i.e. the paint loop ran with perfect
  // data into a buffer that was cleared before it could be measured. A canvas
  // that is drawn at a fixed resolution and SCALED BY CSS cannot be wiped by
  // layout, and 768 = 128 cells x 6 px keeps one module per 6 px exactly.
  return cv.width;
}
// REPAINT AFTER EVERY SIZE CHANGE. Without this the symbol is painted once at
// load and then wiped by the next layout pass that resizes the buffer, which is
// why the pad could look painted one moment and blank the next with no code
// change in between.
function repaint(){
  grid();
}
if(typeof ResizeObserver !== 'undefined'){
  new ResizeObserver(function(){ repaint(); }).observe(cv);
}
addEventListener('resize', repaint);
// CORNER MARKERS (TODO-COORDINATES.md 9.2). QR-style fiducials THREE of the
// four corners of the canvas, so that a SCREENSHOT can be decoded by a script
// (scripts/pad_bbox.py) and the canvas rect recovered exactly -- replacing the
// back-solved anchor, which was circular. The user's constraints, as recorded:
//   * GREY cells, not black: a pen stroke drawn over a marker must COVER it
//     (black wins), so the marker can never be mistaken for ink.
//   * THREE markers, not four. This is what a QR symbol actually looks like:
//     TL, TR and BL carry a finder pattern and the fourth corner is left bare.
//     Four was an invention of ours -- the user's correction: "角上的二维码，你在4个
//     角都画了，这是不对的". A fourth mark carries no information the other three
//     do not already give (three corners fix both axes and the scale), so it
//     was pure decoration and is now gone.
// THE MARKER IS A REAL QR FINDER PATTERN, NOT AN INVENTION OF OURS.
// The user's correction: "I was assuming the corner code is showing like a QR
// corner but it seems you invent yourself". The earlier 9x9 blob with a 3x3 eye
// and a nib was invented and no QR reader could decode it. This is the genuine
// article (ISO/IEC 18004 finder pattern): 7x7 cells of concentric rings at
// 1:1:3:1:1 -- a solid 3x3 centre, a one-cell light ring, a one-cell dark ring
// -- surrounded by the mandatory one-cell LIGHT separator, so the whole mark is
// 9x9 cells. Drawn at 6 px per cell on a 128 grid a mark is 6 cells wide
// (36/768 of the side), and on this rig's 553 px canvas that is ~39 px: the
// same size the earlier blob had, so the layout is unchanged and only the
// picture becomes a QR corner.
//
// The separator must be WHITE, not bare canvas: the grid lines are drawn before
// the marker, so without repainting the separator we would leave grid through
// it and the quiet zone would not be quiet.
const MK_RING = 7;                 // the finder pattern itself
const MK_CELLS = MK_RING + 2;      // + one separator cell on each side
const MK_SEP = 1;                  // cells of light quiet zone around it
// DARK and LIGHT are the only two values inside a marker, and BOTH are painted
// explicitly -- the light ring is never left to the background.
//
// WHY THE LIGHT RING IS PAINTED INK-LIGHT (#b0b0b0), NOT WHITE: a screenshot of
// this pad has NO white. The page background (#111) is darker than the pad
// itself (#fff), and an ink stroke is #111 -- exactly the page background. So a
// decoder that guesses polarity from "the minority of pixels" or from Otsu on
// the WHOLE screen gets both its threshold and its polarity wrong: measured, it
// picked 40 and then called the #fff pad "dark", which swallowed all three
// markers. The fix is to give the marker its own unambiguous two-level
// appearance, well clear of both the pad and the ink:
//     dark cell  #9a9a9a   (~154)
//     light cell #b0b0b0   (~176)
// and the decoder binarizes INSIDE a marker once it has found one -- it never
// needs a global threshold across pad, ink, page and chrome. A #111 stroke drawn
// over a marker is still strictly darker than the lightest marker cell, so ink
// still wins and can never hide behind the marker.
const MK_DARK = '#000000', MK_LIGHT = '#ffffff';
// finder[y][x] over the 7x7 rings, 1 = dark. THE TRUE ISO/IEC 18004 RATIO:
// a solid 3x3 dark core, a one-cell light ring, a one-cell dark ring. Along any
// centre line that is dark, light, dark, light, dark in 1:1:3:1:1.
//
// RETIRED FROM THE PAINT PATH. The page now paints the symbol's real finder
// patterns out of qr_table.go (they are modules 0..6 of the symbol), so this
// function is no longer called; it is kept only so the geometry it documents
// stays readable next to the code that used to draw it. If you reintroduce a
// hand-painted marker, you are rebuilding what the generated table already
// contains -- and a hand-painted one will differ from it.
function mkFinder(y, x){
  const d = Math.max(Math.abs(x - 3), Math.abs(y - 3));  // ring index 0..3
  return (d === 3 || d <= 1) ? 1 : 0;                    // border + core dark
}
// THREE corners, as a QR symbol has: TL, TR, BL. BR is deliberately bare.
const MK_CORNERS = [[0,0],[N-MK_CELLS,0],[0,N-MK_CELLS]];

// THE PAD CARRIES ONLY THE QR EYES -- three finder patterns, in DIM GREY.
//
// The user's instruction, verbatim: "only the eyes should be retained and
// should be dimmed to grey". So the page no longer paints a whole version-27
// symbol. What it paints is the calibration triad the rest of the toolchain
// reads: the three 7x7 finder patterns of a QR, at the cells where a version-27
// symbol puts them (modules 0..6 of the TL, TR and BL corners), with the light
// separator at module 7.
//
// WHY THEY ARE STILL AT THE CANVAS CORNER AND NOT CENTRED. The eyes are the
// fiducials scripts/pad_bbox.py and cmd/pad-bbox locate to recover the canvas
// rect: TL finder flush at the canvas origin, TR at module 118, BL at module
// 118 down. Move them and every measurement in this repo describes a rectangle
// the window does not have. The 128-cell pad minus the 125-module symbol leaves
// 3 cells of white quiet zone on the RIGHT and BOTTOM only -- the user's
// "让右侧还有下方留出白边".
//
// WHY GREY AND NOT BLACK. A black eye at 6 px per module competes with the ink
// a human draws on the same canvas; grey keeps the fiducial readable to a
// decoder while leaving the pad looking like a writing surface. Grey is a
// DARK/LIGHT pair, not a value: the eye's dark cells are EYE_DARK and the
// separator ring and background are EYE_LIGHT, so a reader binarizes INSIDE the
// eye and never needs a global threshold across pad, ink, page and chrome.
//
// Measured levels: dark cell #9a9a9a (~154), light #ffffff (~255). A #111 ink
// stroke is still strictly darker than 154, so ink drawn over an eye still
// wins and can never hide behind it.
const EYE_DARK = '#9a9a9a', EYE_LIGHT = '#ffffff';
// EYE_DX / EYE_DY nudge every eye by a fixed number of CELLS, applied before
// the module->pixel rounding so the pattern lands exactly on the cell lattice
// and its internal 1:1:3:1:1 finder runs stay pixel-exact. The user's
// instruction: "move from the original position 1 cell right and 1 cell down"
// (corrected from an earlier "1 pixel").
//
// A WHOLE-CELL SHIFT is not a small perturbation: at 6 px per cell it moves the
// TL eye's outer corner from the canvas corner to (6,6), so a detector must NOT
// assume the finder starts at module 0 -- it has to read the finder's own
// position. That is the point of the note.
const EYE_DX = 1, EYE_DY = 1;
// mkFinder is the 7x7 finder over ring index d = max(|x-3|,|y-3|): dark at the
// border (d==3) and the 3x3 core (d<=1), light in between. Along any centre
// line that is dark, light, dark, light, dark in 1:1:3:1:1 -- the ISO/IEC 18004
// ratio, and the same runs cmd/pad-bbox's TestFinderRatio checks.
function mkFinder(y, x){
  const d = Math.max(Math.abs(x - 3), Math.abs(y - 3));  // ring index 0..3
  return (d === 3 || d <= 1) ? 1 : 0;                    // border + core dark
}
// marker() paints the three eyes described by window.PAD_EYES, one module per
// cell, flush at the canvas origin. Each eye is 7 modules plus a one-module
// separator on every side; the separator is painted light explicitly so an eye
// still reads correctly if a coloured background is ever put behind it.
function marker(S){
  const cell = S/N;
  const e = window.PAD_EYES;
  fillCalls = 0;
  g.fillStyle = EYE_LIGHT;
  g.fillRect(0, 0, S, S);
  fillCalls++;
  if(!e || !e.origins || e.origins.length !== 3){
    // No eyes: paint nothing rather than an invented picture. A missing
    // window.PAD_EYES is a build defect and must be visible, not plausible.
    g.fillStyle = '#c00';
    g.fillRect(0, 0, S, Math.max(4, cell*2));
    fillCalls++;
    return 0;
  }
  // Rect of module-run [a,b) of an eye whose origin is (ox,oy) cells.
  function rect(ox, oy, x0, y0, x1, y1, col){
    const px0 = Math.round((ox+x0+EYE_DX)*cell), py0 = Math.round((oy+y0+EYE_DY)*cell);
    const px1 = Math.round((ox+x1+EYE_DX)*cell), py1 = Math.round((oy+y1+EYE_DY)*cell);
    g.fillStyle = col;
    g.fillRect(px0, py0, Math.max(1,px1-px0), Math.max(1,py1-py0));
    fillCalls++;
  }
  for(const o of e.origins){
    const sep = e.sep, mod = e.module;
    // separator ring, then the 7x7 finder cell by cell in runs of one row
    rect(o[0]-sep, o[1]-sep, 0, 0, mod+2*sep, mod+2*sep, EYE_LIGHT);
    for(let y=0; y<mod; y++){
      for(let x=0; x<mod; x++){
        if(!mkFinder(y,x)) continue;
        rect(o[0], o[1], x, y, x+1, y+1, EYE_DARK);
      }
    }
  }
  return e.size*cell;
}
// lastS is the side the last grid() painted at, reported by the self-report so
// a mismatch between "the buffer is 812 px" and "the box is 768 px" is VISIBLE
// instead of inferred.
let lastS = 0;
let fillCalls = 0;
function grid(){
  const S = fitSquare();
  lastS = S;
  // marker() lays down the white canvas itself, so a second full-canvas fill
  // here would only add a fillRect to the count for no pixels. One fill, then
  // the eyes.
  //
  // NO GRID LINES. The pad's grid was a drawing aid for a blank canvas; the
  // eyes are the aid now, and a rule every 8 cells would cut through the
  // finder rings a decoder measures.
  marker(S);
}
// pos() is the ONE place a pointer event becomes a coordinate. It records PURE
// CSS-BOX RATIOS (rx, ry in [0,1]); px() is their exact inverse. Deriving the
// ratio from the CSS box while multiplying by the backing store is what made
// ink drift away from the cursor off-centre.
function pos(e, rect){
  const r = rect || cv.getBoundingClientRect();
  if(!(r.width > 0 && r.height > 0)) return null;
  const rx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const ry = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  const u = rx * N, v = ry * N;
  const x = Math.min(N - 1, Math.floor(u)), y = Math.min(N - 1, Math.floor(v));
  return { x:x, y:y, fx:u-x, fy:v-y, rx:rx, ry:ry };
}
function px(p){
  const fx = p.fx === undefined ? 0.5 : p.fx, fy = p.fy === undefined ? 0.5 : p.fy;
  const rxi = p.rx === undefined ? (p.x + fx) / N : p.rx;
  const ryi = p.ry === undefined ? (p.y + fy) / N : p.ry;
  return { x: rxi * cv.width, y: ryi * cv.height };
}
function line(a,b){
  const A=px(a), B=px(b);
  g.strokeStyle='#111'; g.lineWidth=2; g.lineCap='round';
  g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke();
}
// paintAll is the ONLY erase. It repaints the whole canvas from the machine's
// snapshot, so ink that is not in the snapshot cannot survive a repaint.
function paintAll(snap){
  grid();
  const strokes = snap ? snap.strokes : core.committed;
  for(const st of strokes) for(let i=1;i<st.length;i++) line(st[i-1], st[i]);
  const tailPts = snap ? snap.live : core.tail;
  for(let i=1;i<tailPts.length;i++) line(tailPts[i-1], tailPts[i]);
  count.textContent = (snap ? snap.strokes : core.committed).length + ' strokes';
}

// ---------------------------------------------------------------------------
// LOG TRANSPORT. One event per input; the log is an EVENT LOG, so the observer
// reconstructs strokes from down/drag/up. The page never sends a stroke.
// ---------------------------------------------------------------------------
const TS_KEY = 'kvm-pad-last-ts';
let lastTS = 0;
try { lastTS = parseInt(sessionStorage.getItem(TS_KEY) || '0', 10) || 0; } catch(err) {}
// STRICTLY INCREASING. Date.now() has 1 ms granularity and the host can deliver
// a press and its first move, or two moves, inside one millisecond, so two
// events of one gesture could share a ts and the store de-duplicated one away
// (measured: a 315 px drag reduced to two records).
function nextTS(){
  const n = Date.now();
  lastTS = n > lastTS ? n : lastTS + 1;
  try { sessionStorage.setItem(TS_KEY, String(lastTS)); } catch(err) {}
  return lastTS;
}
const CLIENT_KEY = 'kvm-pad-client';
let CLIENT_ID = null;
function clientId(){
  if(CLIENT_ID) return CLIENT_ID;
  try { CLIENT_ID = sessionStorage.getItem(CLIENT_KEY); } catch(err) {}
  if(!CLIENT_ID){
    CLIENT_ID = crypto.randomUUID ? crypto.randomUUID()
              : 'pad-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
    try { sessionStorage.setItem(CLIENT_KEY, CLIENT_ID); } catch(err) {}
  }
  return CLIENT_ID;
}
const PROTOCOL = 2;   // must equal store.go's Protocol; a mismatch makes this page reload
let queue = [], flushT = 0;
const PUSH_DEBOUNCE_MS = 120;
let inFlight = Promise.resolve();
function send(body){
  const payload = {client: clientId(), version: PROTOCOL, events: body};
  const my = inFlight.then(() => fetch('/api/log', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(payload), keepalive: true})
    .then(r => {
      if(r.status === 409){
        live.textContent = 'protocol mismatch — reloading';
        setTimeout(() => location.reload(), 0);
        return Promise.reject('protocol mismatch');
      }
      return r.ok ? r.json() : Promise.reject('HTTP ' + r.status);
    }));
  inFlight = my.catch(() => {});
  return my;
}
function flush(){
  if(!queue.length) return;
  const batch = queue; queue = [];
  send(batch)
    .then(res => { live.textContent = 'appended ' + res.appended + ' event(s), '
                                  + res.duplicates + ' duplicate(s)'; })
    .catch(err => {
      // A failed batch goes back on the queue so input that happened on screen
      // is retried instead of lost. flush() re-sends the SAME kind and ts, which
      // is why the store's de-dup key includes kind and retries stay idempotent.
      queue = batch.concat(queue);
      live.textContent = 'append failed: ' + err;
    });
}
function push(kind, at){
  const ev = {kind: kind, ts: nextTS()};
  if(at){ ev.rx = at.rx; ev.ry = at.ry; }
  queue.push(ev);
  clearTimeout(flushT);
  flushT = setTimeout(flush, PUSH_DEBOUNCE_MS);
}

// ---------------------------------------------------------------------------
// THE MACHINE. pad-core.js is CommonJS, so it arrives here as a module record.
// ---------------------------------------------------------------------------
const core = createPadCore({
  posOf: function(ev){ return ev && ev.rx !== undefined ? ev : pos(ev); },
  onInk: function(from, to){ if(from) line(from, to); },
  onRepaint: function(snap){ paintAll(snap); },
  onEvent: function(kind, at){ push(kind, at); },
  onTransition: function(from, to, why){
    // The observable record of a capture bug: every latch change names itself.
    lastTransition = to + '(' + why + ')';
  },
});
let lastTransition = '';
const bound = bindPad({
  canvas: cv,
  windowTarget: window,
  core: core,
  posOf: function(ev){ return pos(ev); },
  onSample: function(){ /* the machine already painted; nothing to record here */ },
  show: function(e){
    const r = cv.getBoundingClientRect();
    if(e.clientX < r.left || e.clientX >= r.right || e.clientY < r.top || e.clientY >= r.bottom){
      hud.textContent = 'off-grid'; return;
    }
    const p = pos(e, r);
    if(!p) return;
    hud.textContent = 'cell ' + Math.floor(p.rx*N) + ', ' + Math.floor(p.ry*N);
  },
  onIgnore: function(why, e){ live.textContent = 'ignored: ' + why; },
});

// load is the page-reload boundary. The machine is told explicitly rather than
// the transport pushing a bare 'load' event, so the machine's own state (a live
// tail, an armed press, a pending commit) is retired with the ink. A reload must
// start blank: nothing from the previous generation may be re-added.
core.load();

// ---------------------------------------------------------------------------
// Export writes the PAGE'S OWN INK as a .json download. It used to GET a
// server-side record route, deleted on purpose (PAD-PROTOCOL §5: the API
// receives the log, the observer reads the file).
// ---------------------------------------------------------------------------
document.getElementById('save').onclick = function(){
  live.textContent = 'exporting…';
  const strokes = core.committed;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = 'padtrace-' + stamp + '.json';
  const blob = new Blob([JSON.stringify(strokes, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  URL.revokeObjectURL(url);
  live.textContent = 'exported ' + strokes.length + ' stroke(s)';
};
// Clear empties the page AND records the boundary in the log. The pending queue
// is dropped with it: a stroke lifted just before the Clear must not arrive
// after it, and send() queues the clear BEHIND any commit already dispatched.
//
// paintAll runs from the machine's onRepaint, so the canvas is blanked by the
// SAME path that draws it — there is no second, competing erase. `core.clear()`
// also drops a stroke the pen is still holding, so the lift that arrives after
// this cannot commit pre-clear ink.
document.getElementById('clear').onclick = function(){
  queue = []; clearTimeout(flushT);
  core.clear();
  flush();
  count.textContent = '0 strokes';
  live.textContent = 'cleared (new epoch)';
};

// ---------------------------------------------------------------------------
// (publishBox removed) The canvas rect is NOT published. It is a viewport-
// relative CSS measurement, and the screen-space anchor a drawer needs also
// requires the window's screen origin, which the page cannot observe. A
// reader of a published rect gets a number that looks authoritative and is in
// the wrong space. The pad is push-only: strokes travel page -> server -> the
// stroke file on disk, and the file is the only truth.
// ---------------------------------------------------------------------------
// A tab closing right after a lift would drop that stroke: keepalive lets the
// request outlive the page.
addEventListener('pagehide', function(){
  if(!queue.length) return;
  const batch = queue; queue = [];
  try{ send(batch).catch(() => {}); }catch(e){}
});

// BOOTSTRAP AFTER LAYOUT, NOT DURING PARSING. grid() used to run here, at parse
// time, before the browser had laid the canvas out: getBoundingClientRect()
// could report a box the first layout pass then changed, and because assigning
// canvas.width/height CLEARS the bitmap, the one paint that had happened was
// thrown away with nothing left to repaint it. Two animation frames put the
// first paint after layout settles; the ResizeObserver and the resize listener
// keep it correct afterwards.
function boot(){
  // FIRST PAINT SYNCHRONOUSLY. A deferred-only first paint is fragile: if the
  // animation-frame callback never fires the canvas stays white forever, and
  // measured under headless Edge it never fired at all (`dark 0`). Painting
  // immediately costs nothing and then the deferred pass corrects the size once
  // layout has settled.
  repaint();
  selfReport();
  const again = function(){
    repaint();
    selfReport();
  };
  if(typeof requestAnimationFrame === 'function'){
    requestAnimationFrame(function(){ requestAnimationFrame(again); });
  }
  setTimeout(again, 50);
  setTimeout(again, 250);
}
boot();
// SELF-REPORT. The pad's own pixels are the only witness a screenshot cannot
// contradict: count what is actually ON the canvas and say it in the status
// line. Two vision reads of this window returned "QR visible" and "canvas
// blank" for the same frame, so the verdict has to come from the canvas.
function selfReport(){
  try{
    const w = cv.width, h = cv.height;
    const d = g.getImageData(0, 0, w, h).data;
    let dark = 0, grey = 0, minX = w, minY = h, maxX = -1, maxY = -1;
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const i = (y*w + x)*4;
        const r = d[i], gg = d[i+1], b = d[i+2];
        // An eye cell: a neutral mid-luma pixel well clear of both white
        // (255) and ink (#111 ~17). The band is deliberately narrow so a
        // stray anti-aliased edge cannot masquerade as an eye.
        if(Math.abs(r - gg) <= 6 && Math.abs(gg - b) <= 6 && r >= 120 && r <= 200){
          grey++;
          if(x < minX) minX = x;
          if(x > maxX) maxX = x;
          if(y < minY) minY = y;
          if(y > maxY) maxY = y;
        }
        if(r < 128 && gg < 128 && b < 128) dark++;
      }
    }
    const e = window.PAD_EYES;
    // PROVE THE PAINT LOOP RAN. fillCalls counts fillRect invocations: if it
    // is in the hundreds and grey is still 0, the loop drew into a buffer
    // getImageData is not reading; if it is ~1, the loop never entered.
    //
    // EYES ARE GREY, NOT BLACK, so a black count of 0 is CORRECT here. What
    // must be non-zero is `grey` -- the eye's #9a9a9a cells -- and the bbox
    // below is computed from THAT, so it reports where the eyes actually are.
    const trace = 'eyes=' + (e ? (e.size + '@' + e.grey) : 'undefined') +
      ' S=' + lastS + ' ctx=' + (g ? 'ok' : 'null') +
      ' fills=' + fillCalls + ' grey=' + grey;
    live.textContent = 'canvas ' + w + 'x' + h + ' dark ' + dark + ' ' + trace +
      (maxX >= 0 ? (' bbox ' + minX + ',' + minY + '..' + maxX + ',' + maxY) : ' bbox none');
    document.title = 'kvm inputpad | canvas ' + w + 'x' + h + ' | dark ' + dark + ' | ' + trace +
      (maxX >= 0 ? (' | bbox ' + minX + ',' + minY + '..' + maxX + ',' + maxY) : ' | bbox none');
  }catch(err){
    live.textContent = 'self-report failed: ' + err;
  }
}
selfReport();
</script>
